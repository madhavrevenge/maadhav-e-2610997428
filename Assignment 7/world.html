<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map Explorer</title>
</head>
<body>
    <h1>world map explorer</h1>
    <img src="world map.png" usemap="#worldmap" alt="world map" >
    <map name="worldmap">
        <area
        shape="circle"
        coords="108,888,40"
        href="https://openai.com/index/chatgpt/"
        target="_blank">

        <area
        shape="rect"
        coords="1213,893,1509,999"
        href="https://www.google.com/"
        target="_blank">

        <area
        shape="default"
        href="https://www.cuchd.in/"
        target="_blank">

    </map>
    
</body>
</html>
